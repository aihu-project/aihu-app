name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build package explicitly
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test package
        run: npm test
      - name: Test injected dist regression
        run: npm run test:release-contract
      - name: Check release contract
        run: npm run release:contract
