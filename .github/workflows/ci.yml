name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Build package explicitly
        run: npm run build
      - name: Build and exercise a clean isolated consumer
        run: |
          pack_dir="$RUNNER_TEMP/aihu-app-ci-pack"
          mkdir -p "$pack_dir"
          tgz="$(npm pack --ignore-scripts --pack-destination "$pack_dir" | tail -1)"
          npm run test:consumer -- --tarball="$pack_dir/$tgz" --fixtures
      - name: Typecheck
        run: npm run typecheck
      - name: Install unpublished peer contract fixtures
        run: npm run prepare:peer-contract-fixtures
      - name: Test package
        env:
          AIHU_CONFIG_LOADER_E2E: '1'
          AIHU_PEER_CONTRACT_FIXTURES: '1'
        run: npm test
      - name: Test injected dist regression
        run: npm run test:release-contract
      - name: Check release contract
        run: npm run release:contract
